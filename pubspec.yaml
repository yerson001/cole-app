name: coleapp
description: "Colecheck - Gestión educativa móvil"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.1.1
  shared_preferences: ^2.5.3
  http: ^1.3.0
  injectable: ^3.0.0
  logging: ^1.3.0
  tutorial_coach_mark: ^1.3.3
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  pdf: ^3.13.0
  path_provider: ^2.1.6
  google_fonts: ^8.2.1
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerif-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSerif-Black.ttf
          weight: 900
